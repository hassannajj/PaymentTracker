<!DOCTYPE html>
<html lang="en">
<head>
    <title>Transactions</title>
    <style>
        td input { width: 100%; box-sizing: border-box; }
        .btn-edit, .btn-save, .btn-cancel { cursor: pointer; }
        .edit-controls { display: none; }
        tr.editing .edit-controls { display: inline; }
        tr.editing .btn-edit { display: none; }
        .error-msg { color: red; font-size: 0.85em; }
    </style>
</head>
<body>
    <a href="/">Home</a>
    <h1>Transactions</h1>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Customer ID</th>
                <th>Type</th>
                <th>Amount ($)</th>
                <th>Date</th>
                <th>Notes</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for t in transactions %}
            <tr data-id="{{ t.id }}">
                <td>{{ t.id }}</td>
                <td>{{ t.customer_id }}</td>
                <td>{{ t.transaction_type }}</td>
                <td class="cell-amount">{{ t.amount }}</td>
                <td class="cell-date">{{ t.date.strftime('%Y-%m-%d') }}</td>
                <td class="cell-notes">{{ t.notes }}</td>
                <td>
                    <button class="btn-edit">Edit</button>
                    <span class="edit-controls">
                        <button class="btn-save">Save</button>
                        <button class="btn-delete">Delete</button>
                        <button class="btn-cancel">Cancel</button>
                    </span>
                    <span class="error-msg"></span>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
        document.querySelector('tbody').addEventListener('click', function (e) {
            const row = e.target.closest('tr');
            if (e.target.classList.contains('btn-edit'))   enterEditMode(row);
            if (e.target.classList.contains('btn-cancel')) exitEditMode(row);
            if (e.target.classList.contains('btn-save'))   saveRow(row);
            if (e.target.classList.contains('btn-delete')) deleteRow(row);
        });

        function enterEditMode(row) {
            const amount = row.querySelector('.cell-amount');
            const date   = row.querySelector('.cell-date');
            const notes  = row.querySelector('.cell-notes');

            amount.dataset.orig = amount.textContent.trim();
            date.dataset.orig   = date.textContent.trim();
            notes.dataset.orig  = notes.textContent.trim();

            amount.innerHTML = `<input type="number" step="0.01" value="${amount.dataset.orig}">`;
            date.innerHTML   = `<input type="date" value="${date.dataset.orig}">`;
            notes.innerHTML  = `<input type="text" value="${notes.dataset.orig}">`;

            row.classList.add('editing');
            row.querySelector('.error-msg').textContent = '';
        }

        function exitEditMode(row) {
            row.querySelector('.cell-amount').textContent = row.querySelector('.cell-amount').dataset.orig;
            row.querySelector('.cell-date').textContent   = row.querySelector('.cell-date').dataset.orig;
            row.querySelector('.cell-notes').textContent  = row.querySelector('.cell-notes').dataset.orig;
            row.classList.remove('editing');
            row.querySelector('.error-msg').textContent = '';
        }

        function deleteRow(row) {
            const id = row.dataset.id;
            const confirmed = window.confirm(
                `Delete transaction #${id}? This cannot be undone.`
            );
            if (!confirmed) return;

            fetch(`/transactions/${id}`, { method: 'DELETE' })
            .then(res => {
                if (res.ok) {
                    row.remove();
                } else {
                    res.json().then(data => {
                        row.querySelector('.error-msg').textContent = data.error || 'Delete failed.';
                    });
                }
            })
            .catch(() => {
                row.querySelector('.error-msg').textContent = 'Network error — transaction not deleted.';
            });
        }

        function saveRow(row) {
            const id     = row.dataset.id;
            const amount = row.querySelector('.cell-amount input').value;
            const date   = row.querySelector('.cell-date input').value;
            const notes  = row.querySelector('.cell-notes input').value;

            const confirmed = window.confirm(
                `Save changes to transaction #${id}?\n\nAmount: $${amount}\nDate: ${date}\nNotes: ${notes}`
            );
            if (!confirmed) return;

            fetch(`/transactions/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount, date, notes })
            })
            .then(res => res.json().then(data => ({ ok: res.ok, data })))
            .then(({ ok, data }) => {
                if (!ok) {
                    row.querySelector('.error-msg').textContent = data.error || 'Save failed.';
                    return;
                }
                row.querySelector('.cell-amount').textContent = data.amount;
                row.querySelector('.cell-date').textContent   = data.date;
                row.querySelector('.cell-notes').textContent  = data.notes;
                row.classList.remove('editing');
                row.querySelector('.error-msg').textContent = '';
            })
            .catch(() => {
                row.querySelector('.error-msg').textContent = 'Network error — changes not saved.';
            });
        }
    </script>
</body>
</html>
