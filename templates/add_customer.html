{% extends 'base.html' %}
{% block title %}Add Customer — Payment Tracker{% endblock %}
{% block content %}
<h1>Add Customer</h1>
<form method="post">
    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required style="max-width: 300px;">
    </div>
    <div class="form-group">
        <label for="rate">Monthly Rate ($)</label>
        <input type="number" id="rate" name="rate" required style="max-width: 300px;">
    </div>
    <input type="submit" value="Add Customer">
</form>
{% endblock %}
